name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v7.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: python check_plan.py fixtures/pass.json --policy policy.json
      - name: expect fail.json to fail the policy check
        run: |
          if python check_plan.py fixtures/fail.json --policy policy.json; then
            echo "expected fixtures/fail.json to fail"
            exit 1
          fi
