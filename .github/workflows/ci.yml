name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: python check_plan.py fixtures/pass.json --policy policy.json
      - name: expect fail.json to fail the policy check
        run: |
          if python check_plan.py fixtures/fail.json --policy policy.json; then
            echo "expected fixtures/fail.json to fail"
            exit 1
          fi
